name: Labels

# Keeps the repository's labels in step with .github/labels.json, so the
# labeler and the issue forms never reference a label that does not exist.
on:
  push:
    branches:
      - master
    paths:
      - ".github/labels.json"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync Labels
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run labels
