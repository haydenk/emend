name: Release

# Publishes the release for an existing semver tag: Dagger tests, packages and
# attaches emend-<tag>.tar.gz, with the tag's CHANGELOG.md section as the
# notes. Hugo Modules resolve the same tags, so module users and tarball users
# get identical versions.
#
# Releases always start from a release branch: the Tag Release workflow creates
# the tag when a release/* pull request merges, then calls this workflow.
# There is deliberately no `on: push: tags` trigger, so pushing a tag by hand
# releases nothing. workflow_dispatch exists only to retry the release of a tag
# that already exists (it runs this file from master, so a pipeline fix applies).
on:
  workflow_call:
    inputs:
      tag:
        description: The tag to release, for example v1.2.3. It must already exist.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag whose release should be (re)published, for example v1.2.3.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          # Full history, to check the tag against master below.
          fetch-depth: 0
      - name: Require the tag to be on master
        run: git merge-base --is-ancestor HEAD origin/master
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Check tools
        run: mise run setup --frozen
      - name: Test, package and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The task asks for confirmation when run by hand.
          MISE_YES: "1"
          TAG: ${{ inputs.tag }}
        run: mise run release "$TAG"
