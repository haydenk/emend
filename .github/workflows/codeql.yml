name: CodeQL

# Advanced setup, rather than GitHub's default setup, for two reasons the
# default cannot handle:
#   - Go: .dagger/main.go imports code that Dagger generates and does not
#     commit, so the analysis only type-checks after `dagger develop` has run.
#   - the runner: default setup always uses the floating ubuntu-latest label.
# Default setup must be switched off for these results to be accepted:
#   gh api -X PATCH repos/OWNER/REPO/code-scanning/default-setup -f state=not-configured
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        if: matrix.language == 'go'
      - name: Generate the Dagger module's code
        if: matrix.language == 'go'
        run: dagger develop
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build the Dagger module
        if: matrix.language == 'go'
        working-directory: .dagger
        run: go build ./...
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
